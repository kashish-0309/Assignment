 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .product-card {
            background-color: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            color: #333;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <div class="product-card">
            <img src="https://placehold.co/220x140?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/220x140?text=Watch" alt="Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/220x140?text=Shoes" alt="Shoes">
            <h3>Sports Shoes</h3>
            <p class="price">₹1,199</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/220x140?text=Bag" alt="Bag">
            <h3>Travel Bag</h3>
            <p class="price">₹799</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
