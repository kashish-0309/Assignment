 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact page of my website">

    <title>Contact - My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #243b53;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #334e68;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd166;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #243b53;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: #243b53;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <p>We Would Love to Hear from You</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="registration.html">Registration</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2>Contact Information</h2>

        <p><strong>Name:</strong> Kashish Gupta</p>
        <p><strong>Course:</strong> BCA - Artificial Intelligence</p>
        <p><strong>Purpose:</strong> HTML Practical Project</p>

        <h2>Send a Message</h2>

        <form action="#" method="get">

            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message"
                      rows="5" required></textarea>

            <button type="submit">Send Message</button>

        </form>
    </main>

    <footer>
        <p>Copyright 2026 | My Website</p>
    </footer>

</body>
</html>
