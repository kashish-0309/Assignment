<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .product-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            color: #333;
        }

        .price {
            color: #16803c;
            font-weight: bold;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1746a2;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="product-grid">

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Smart+Watch" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Shoes" alt="Sports Shoes">
            <h3>Sports Shoes</h3>
            <p class="price">₹1,199</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Backpack" alt="Backpack">
            <h3>Backpack</h3>
            <p class="price">₹799</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Camera" alt="Camera">
            <h3>Camera</h3>
            <p class="price">₹5,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Keyboard" alt="Keyboard">
            <h3>Keyboard</h3>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
