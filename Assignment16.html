 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in the details below to register.</p>
    </header>

    <hr>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
                <br><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>
                <br><br>

                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob">
                <br><br>

                <p>Gender:</p>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
                <br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Course Information</legend>

                <label for="course">Select Course:</label><br>

                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="BCA AI">BCA - Artificial Intelligence</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BTech">B.Tech</option>
                </select>

                <br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number">
                <br><br>

                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="4" cols="30"
                          placeholder="Enter your address"></textarea>
                <br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I confirm that the information is correct.</label>
                <br><br>

                <button type="submit">Register</button>
                <button type="reset">Clear Form</button>

            </fieldset>

        </form>
    </main>

    <footer>
        <hr>
        <p>Created by Kashish Gupta | BCA AI Student</p>
    </footer>

</body>
</html>
