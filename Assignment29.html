 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        .hero {
            position: relative;
            min-height: 450px;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
            display: flex;
            align-items: center;
            padding: 50px;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            width: 250px;
            height: 250px;
            background-color: rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            right: 40px;
            top: 60px;
            z-index: 0;
        }

        .circle-two {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: rgba(251, 191, 36, 0.4);
            border-radius: 50%;
            right: 150px;
            bottom: 20px;
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: #dbeafe;
        }

        .hero button {
            background-color: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .hero button:hover {
            background-color: #f59e0b;
        }

        @media (max-width: 600px) {
            .hero {
                padding: 30px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .circle {
                right: -100px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="circle"></div>
        <div class="circle-two"></div>

        <div class="hero-content">
            <h1>Build Your Future with Technology</h1>

            <p>
                Explore new ideas, develop your skills, and discover
                how technology can help you achieve your goals.
            </p>

            <button onclick="alert('Welcome to our website!')">
                Get Started
            </button>
        </div>
    </section>

</body>
</html>
