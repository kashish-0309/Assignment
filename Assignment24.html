 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design Tokens</title>

    <style>
        :root {
            --primary-color: #17365d;
            --secondary-color: #d4a373;
            --background-color: #eef2f7;
            --text-color: #333333;

            --heading-size: 32px;
            --subheading-size: 22px;
            --paragraph-size: 16px;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: var(--paragraph-size);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: var(--heading-size);
            text-align: center;
        }

        h2 {
            color: var(--primary-color);
            font-size: var(--subheading-size);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
        }

        p {
            font-size: var(--paragraph-size);
            line-height: 1.6;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CSS Design Tokens</h1>

        <h2>What Are Design Tokens?</h2>
        <p>
            Design tokens are reusable values for colours, font sizes,
            and other design properties. CSS variables help us manage
            these values easily.
        </p>

        <h2>Benefits</h2>
        <p>
            CSS variables make websites consistent, easier to maintain,
            and quicker to redesign.
        </p>

        <button onclick="alert('CSS variables make styling easier')">
            Learn More</button>
    </div>
</body>
</html>
