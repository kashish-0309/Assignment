<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 320px;
            max-width: 100%;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            height: 100px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .profile-image {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid white;
            background-color: #e0e7ff;
            margin-top: -55px;
            object-fit: cover;
        }

        .profile-card h1 {
            color: #1e293b;
            font-size: 24px;
            margin: 15px 0 5px;
        }

        .role {
            color: #6366f1;
            font-weight: bold;
            margin: 5px 0;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            padding: 0 20px;
        }

        .skills {
            margin: 20px 0;
        }

        .skills span {
            display: inline-block;
            background-color: #ede9fe;
            color: #5b21b6;
            padding: 7px 10px;
            margin: 4px;
            border-radius: 15px;
            font-size: 12px;
        }

        .profile-card button {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            margin: 5px 0 25px;
            cursor: pointer;
            font-size: 15px;
        }

        .profile-card button:hover {
            background-color: #3730a3;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div class="card-header"></div>

        <img
            class="profile-image"
            src="https://placehold.co/200x200/e0e7ff/4338ca?text=Profile"
            alt="Profile placeholder"
        >

        <h1>Kashish Gupta</h1>

        <p class="role">BCA AI Student</p>

        <p class="description">
            Passionate about artificial intelligence, web development,
            and learning new technologies.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>AI</span>
        </div>

        <button onclick="alert('Thanks for visiting my profile!')">
            Contact Me
        </button>

    </div>

</body>
</html>
