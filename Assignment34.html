 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #222;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .hero-content h1 {
            font-size: 45px;
        }

        .hero-content p {
            font-size: 18px;
            line-height: 1.6;
        }

        .hero-content button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background-color: white;
            color: #5b55c6;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero-content h1 {
                font-size: 32px;
            }
        }
        @media (max-width: 480px) {
    .navbar {
        flex-direction: column;
        padding: 10px;
    }

    .hero {
        padding: 20px;
        text-align: center;
    }
}

    </style>
</head>

<body>

    <nav>
        <div class="logo">MyWebsite</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Welcome to My Website</h1>
            <p>We create beautiful and responsive websites for everyone.</p>
            <button onclick="alert('Welcome!')">Get Started</button>
        </div>
    </section>
    <section id="about" style="padding: 50px; text-align: center;">
        <h2>About Us</h2>
        <p>Learn more about our website and our team.</p>
    </section>

    <section id="services" style="padding: 50px; text-align: center; background: #f2f2f2;">
        <h2>Our Services</h2>
        <p>We provide web design and development services.</p>
    </section>

    <section id="contact" style="padding: 50px; text-align: center;">
        <h2>Contact Us</h2>
        <p>Email: example@gmail.com</p>
    </section>


</body>
</html>
