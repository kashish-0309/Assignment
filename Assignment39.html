 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .layout {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar products";
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        header {
            grid-area: header;
            background: #2563eb;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        aside {
            grid-area: sidebar;
            background: white;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        aside h3 {
            margin-top: 0;
        }

        aside p {
            padding: 10px;
            background: #f1f5f9;
            border-radius: 5px;
        }

        .products {
            grid-area: products;
            padding: 25px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .layout {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "products";
                grid-template-columns: 1fr;
            }

            aside {
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <header>My Product Store</header>

        <aside>
            <h3>Categories</h3>
            <p>Electronics</p>
            <p>Clothing</p>
            <p>Accessories</p>
            <p>Home & Living</p>
        </aside>

        <main class="products">
            <h2>Our Products</h2>

            <div class="product-grid">

                <div class="product-card">
                    <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
                    <h3>Headphones</h3>
                    <p class="price">₹999</p>
                    <button>Buy Now</button>
                </div>

                <div class="product-card">
                    <img src="https://placehold.co/300x200?text=Watch" alt="Smart Watch">
                    <h3>Smart Watch</h3>
                    <p class="price">₹1,499</p>
                    <button>Buy Now</button>
                </div>

                <div class="product-card">
                    <img src="https://placehold.co/300x200?text=Shoes" alt="Sports Shoes">
                    <h3>Sports Shoes</h3>
                    <p class="price">₹1,199</p>
                    <button>Buy Now</button>
                </div>

                <div class="product-card">
                    <img src="https://placehold.co/300x200?text=Backpack" alt="Backpack">
                    <h3>Backpack</h3>
                    <p class="price">₹799</p>
                    <button>Buy Now</button>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
